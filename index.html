<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ID Sketch</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="board"></canvas>
<textarea id="editor" spellcheck="false" hidden></textarea>

<div id="topleft">
  <button id="menuBtn" class="iconbtn" title="Canvassen en bestand"></button>
  <span id="docName"></span>
  <span id="bridgeDot" title="Verbonden met Claude" hidden></span>
</div>

<div id="toolbar"></div>

<aside id="panel" hidden></aside>

<aside id="sidebar" hidden>
  <h2>Canvassen</h2>
  <ul id="canvasList"></ul>
  <button id="newCanvas" class="wide">+ Nieuw canvas</button>
  <hr>
  <button id="importImg" class="wide">Afbeelding invoegen…</button>
  <input id="imgInput" type="file" accept="image/*" multiple hidden>
  <button id="exportPng" class="wide">Exporteer als PNG</button>
  <button id="saveJson" class="wide">Bewaar als bestand</button>
  <button id="openJson" class="wide">Open bestand…</button>
  <button id="clearCanvas" class="wide danger">Canvas leegmaken</button>
  <hr>
  <button id="bridgeBtn" class="wide" title="Laat Claude via de MCP-server op dit canvas tekenen"></button>
  <input id="fileInput" type="file" accept=".json,.idsketch,application/json" hidden>
  <hr>
  <h2>Thema <span id="themeName" class="val"></span></h2>
  <div id="themeList" class="chips"></div>
  <h2>Kleurenpalet <span id="paletteName" class="val"></span></h2>
  <div id="paletteList" class="chips"></div>
</aside>

<button id="rightBtn" class="iconbtn" title="Lagen en bibliotheek"></button>
<aside id="rightbar" hidden>
  <div id="rightTabs" class="tabs">
    <button data-tab="layers">Lagen</button>
    <button data-tab="lib">Bibliotheek</button>
  </div>
  <div id="layersPane">
    <ul id="layerList"></ul>
    <button id="newLayer" class="wide">+ Nieuwe laag</button>
    <p>Nieuwe objecten komen op de gekozen laag. Bovenaan in de lijst ligt bovenop.</p>
  </div>
  <div id="libPane" hidden></div>
</aside>
<div id="toast" hidden></div>

<div id="ctxMenu" hidden></div>
<div id="gridPop" hidden></div>

<div id="palPop" hidden>
  <h3>Eigen palet</h3>
  <label><span>Coolors-link of hex-kleuren</span><input id="palInput" type="text" spellcheck="false" autocomplete="off" placeholder="coolors.co/palette/fffcf2-ccc5b9-403d39-252422-eb5e28"></label>
  <div id="palPreview"></div>
  <label><span>Naam</span><input id="palName" type="text" maxlength="24" autocomplete="off"></label>
  <a href="https://coolors.co/palettes/trending" target="_blank" rel="noopener">Zoek een palet op Coolors ↗</a>
  <div class="btns"><button id="palCancel">Annuleren</button><button id="palAdd" class="primary">Toevoegen</button></div>
</div>

<div id="bottomright"><button id="bgBtn" title="Canvaskleur"></button></div>
<div id="bgPop" hidden></div>

<div id="bottomleft">
  <div class="group">
    <button id="zoomOut" title="Uitzoomen (Ctrl -)"></button>
    <button id="zoomReset" title="Zoom herstellen (Ctrl 0)">100%</button>
    <button id="zoomIn" title="Inzoomen (Ctrl +)"></button>
  </div>
  <div class="group">
    <button id="undoBtn" title="Ongedaan maken (Ctrl Z)"></button>
    <button id="redoBtn" title="Opnieuw (Ctrl Shift Z)"></button>
  </div>
  <div class="group">
    <button id="gridBtn" title="Raster en snappen"></button>
  </div>
</div>

<script src="vendor/rough.js"></script>
<script src="vendor/polygon-clipping.js"></script>
<script src="app.js?v=2"></script>
</body>
</html>
